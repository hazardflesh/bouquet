<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For You 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --rose-deep:#9b2335;--rose-mid:#c8415a;--rose-light:#e8758a;--rose-pale:#f4b8c5;
  --leaf-dark:#2d5a3d;--leaf-mid:#3d7a50;
  --cream:#fdf4ee;--warm:#fff8f3;--gold:#c8963c;--gold-l:#e8c070;--ink:#1e1010;
}

html{height:100%;-webkit-text-size-adjust:100%;}
body{
  font-family:'Jost',sans-serif;
  background:var(--cream);
  min-height:100%;
  min-height:-webkit-fill-available;
  overflow:hidden;
  position:fixed;
  width:100%;
  /* iOS Safari touch fix */
  -webkit-tap-highlight-color:transparent;
}

/* BG */
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 18% 18%,rgba(248,195,210,.45) 0%,transparent 55%),
    radial-gradient(ellipse at 82% 82%,rgba(232,192,210,.35) 0%,transparent 55%),
    linear-gradient(160deg,#fdf4ee 0%,#fdeef4 50%,#f8eef8 100%);
}

/* FALLING PETALS */
.petal-layer{position:fixed;inset:0;pointer-events:none;z-index:1;}
.fp{position:absolute;border-radius:80% 20% 80% 20%;opacity:0;animation:floatDown linear infinite;}
@keyframes floatDown{
  0%  {transform:translateY(-60px) rotate(0deg);opacity:0;}
  10% {opacity:.7;}
  90% {opacity:.35;}
  100%{transform:translateY(105vh) rotate(380deg);opacity:0;}
}

/* ── PAGE SYSTEM ──
   Key iOS fix: use visibility instead of pointer-events alone,
   and don't use display:none (causes layout recalc bugs on Safari).
   We show/hide with opacity + visibility toggled via JS class.
*/
.page{
  position:fixed;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:env(safe-area-inset-top,20px) 16px env(safe-area-inset-bottom,20px);
  transition:opacity .7s ease, visibility .7s ease;
}
.page.hidden{
  opacity:0;
  visibility:hidden; /* iOS Safari respects this better than pointer-events */
}

/* ── PAGE 1 ── */
.q-card{
  position:relative;
  /* No backdrop-filter — causes iOS touch blocking bugs */
  background:rgba(255,251,249,.96);
  border:1px solid rgba(200,150,160,.3);
  border-radius:24px;
  padding:48px 36px 42px;
  text-align:center;
  max-width:420px;width:92%;
  box-shadow:0 20px 60px rgba(155,35,53,.14),0 4px 16px rgba(155,35,53,.08);
  animation:cardRise .9s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardRise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

.flower-icon{font-size:3.4rem;display:block;margin-bottom:16px;animation:bloom 4s ease-in-out infinite;}
@keyframes bloom{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.1) rotate(3deg)}}

.q-title{
  font-family:'Cormorant Upright',serif;
  font-size:1.75rem;font-style:italic;font-weight:300;
  color:var(--ink);line-height:1.45;margin-bottom:32px;
}
.q-title span{color:var(--rose-mid);font-weight:600;}

.btns{display:flex;gap:14px;justify-content:center;}

/* Big tap targets for iOS */
.btn{
  font-family:'Cormorant Upright',serif;
  font-size:1.15rem;font-weight:600;letter-spacing:.06em;
  padding:16px 40px;
  border-radius:60px;border:none;
  cursor:pointer;
  /* iOS button fix */
  -webkit-appearance:none;
  touch-action:manipulation;
  transition:transform .15s,box-shadow .15s;
}
.btn:active{transform:scale(.95)!important;}
.btn-yes{
  background:linear-gradient(135deg,#c8415a,#9b2335);
  color:#fff;
  box-shadow:0 8px 24px rgba(155,35,53,.4);
}
.btn-no{
  background:#fff;color:var(--rose-mid);
  border:1.5px solid var(--rose-pale);
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.wrong-msg{
  margin-top:20px;
  font-family:'Cormorant Upright',serif;
  font-style:italic;font-size:1rem;
  color:var(--rose-mid);
  min-height:24px;
  opacity:0;transition:opacity .4s;
}
.wrong-msg.show{opacity:1;}

/* ── PAGE 2 ── */
#page2{justify-content:center;gap:0;}

.p2-title{
  font-family:'Pinyon Script',cursive;
  font-size:clamp(1.6rem,6vw,2.2rem);
  color:var(--rose-deep);
  text-align:center;
  margin-bottom:6px;
  padding:0 20px;
  text-shadow:0 2px 10px rgba(155,35,53,.18);
}

/* bouquet-scene: NO opacity animation — that was blocking iOS touches */
.bouquet-scene{
  position:relative;
  display:inline-flex;
  align-items:flex-end;
  justify-content:center;
}

svg.bq{
  width:clamp(270px, 82vw, 390px);
  height:auto;
  filter:drop-shadow(0 6px 16px rgba(155,35,53,.2));
  display:block;
}

/* LETTER BUTTON — larger tap target, no animation-delay opacity trap */
.ltr-btn{
  position:absolute;
  bottom:22px;right:-12px;
  background:linear-gradient(135deg,#fff8f0,#fef3e8);
  border:1.5px solid var(--gold-l);
  border-radius:12px;
  padding:12px 16px;
  display:flex;align-items:center;gap:7px;
  font-family:'Cormorant Upright',serif;
  font-size:.95rem;font-style:italic;font-weight:600;
  color:var(--gold);
  cursor:pointer;
  -webkit-appearance:none;
  touch-action:manipulation;
  box-shadow:0 5px 18px rgba(200,150,60,.3);
  white-space:nowrap;
  /* No opacity:0 + animation — was blocking touch on iOS */
  z-index:10;
}
.ltr-btn .env{font-size:1.2rem;}

/* ── MODAL ──
   Key iOS fix: use -webkit-overflow-scrolling, no backdrop-filter on overlay
*/
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(30,10,10,.6);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;
  transition:opacity .4s ease, visibility .4s ease;
}
.overlay.open{opacity:1;visibility:visible;}

.ltr-card{
  position:relative;
  background:var(--warm);
  border-radius:24px 24px 0 0;
  padding:48px 32px calc(32px + env(safe-area-inset-bottom,16px));
  width:100%;max-width:500px;
  text-align:center;
  box-shadow:0 -8px 40px rgba(30,10,10,.2);
  max-height:90vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  transform:translateY(100%);
  transition:transform .45s cubic-bezier(.22,1,.36,1);
}
.overlay.open .ltr-card{transform:translateY(0);}

/* shimmer top bar */
.ltr-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--rose-deep),var(--rose-light),var(--gold),var(--rose-light),var(--rose-deep));
  background-size:200% 100%;
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:0 0}100%{background-position:200% 0}}

/* drag handle */
.drag-handle{
  width:40px;height:4px;
  background:rgba(155,35,53,.2);
  border-radius:4px;
  margin:0 auto 20px;
}

.close-btn{
  position:absolute;top:16px;right:18px;
  background:none;border:none;cursor:pointer;
  font-size:1.2rem;color:#bbb;
  padding:8px;
  -webkit-appearance:none;
  touch-action:manipulation;
  z-index:1;
}
.close-btn:active{color:var(--rose-mid);}

.ltr-icon{font-size:2.6rem;display:block;margin-bottom:4px;animation:heartbeat 1.6s ease-in-out infinite;}
@keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.15)}56%{transform:scale(1)}}

.ltr-divider{width:70px;height:1.5px;margin:12px auto;background:linear-gradient(to right,transparent,var(--gold),transparent);}

.ltr-salutation{
  font-family:'Pinyon Script',cursive;
  font-size:1.8rem;color:var(--rose-deep);
  margin-bottom:10px;line-height:1.45;
}
.ltr-body{
  font-family:'Cormorant Upright',serif;
  font-style:italic;font-size:1.08rem;
  line-height:1.9;color:#3a1818;font-weight:300;
}
.ltr-sign{
  font-family:'Pinyon Script',cursive;
  font-size:1.55rem;color:var(--rose-mid);
  margin-top:14px;display:block;
}

/* Tablet / desktop — center modal */
@media(min-width:500px){
  .overlay{align-items:center;}
  .ltr-card{border-radius:24px;max-width:420px;width:90%;padding:48px 44px 44px;}
}
</style>
</head>

<div class="overlay" id="overlay">

    <div class="ltr-divider"></div>
    <p class="ltr-body">
      I love you with all my heart.<br><br>
      I'm so lucky to be with you and will
      forever cherish the memories that we
      have and will create.<br><br>
      I love you the mosttt,<br>
      my loveee.
    </p>
    <span class="ltr-sign">Forever &hearts;</span>
    <div class="ltr-divider"></div>
  </div>
</div>

<script>
// Petals
const pc=['#f4b8c5','#f9d0da','#fce4ec','#e8a0b4','#fddde6','#f0c0d0'];
const pl=document.getElementById('petals');
for(let i=0;i<28;i++){
  const d=document.createElement('div');d.className='fp';
  const s=7+Math.random()*12;
  Object.assign(d.style,{
    left:Math.random()*100+'vw',top:'-20px',
    width:s+'px',height:s*1.45+'px',
    background:pc[~~(Math.random()*pc.length)],
    animationDuration:(9+Math.random()*10)+'s',
    animationDelay:(Math.random()*14)+'s',
    transform:'rotate('+Math.random()*360+'deg)'
  });
  pl.appendChild(d);
}

// No button
let nc=0;
const nl=[
  '💕 That\'s the wrong answer, love!',
  '🌹 Try again — the only answer is Yes!',
  '😄 Come on, you know the right answer…',
  '💐 Yes is the only option, darling!'
];
function goNo(){
  nc++;
  const m=document.getElementById('wrongMsg');
  m.textContent=nl[Math.min(nc-1,nl.length-1)];
  m.classList.remove('show');
  void m.offsetWidth;
  m.classList.add('show');
}

// Yes button — use visibility toggle (iOS-safe)
function goYes(){
  const p1=document.getElementById('page1');
  const p2=document.getElementById('page2');
  p1.classList.add('hidden');
  // Small delay so transition plays before page2 appears
  setTimeout(function(){p2.classList.remove('hidden');},50);
}

// Modal — use addEventListener instead of onclick for iOS reliability
document.getElementById('ltrBtn').addEventListener('click',function(){
  document.getElementById('overlay').classList.add('open');
});
document.getElementById('closeBtn').addEventListener('click',function(){
  document.getElementById('overlay').classList.remove('open');
});
// Tap overlay background to close
document.getElementById('overlay').addEventListener('click',function(e){
  if(e.target===this) this.classList.remove('open');
});
// Prevent card tap from closing
document.getElementById('ltrCard').addEventListener('click',function(e){
  e.stopPropagation();
});
</script>
